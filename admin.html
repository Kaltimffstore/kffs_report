<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - KFFS REPORT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
<a href="index.html" class="logo">KFFS <span class="logo-accent">REPORT</span> <small style="color:var(--text-muted);">Admin</small></a>
<ul class="nav-links" id="navLoggedIn" style="display:none;">
<li><a href="#" id="adminEmail" style="color:var(--primary);"></a></li>
<li><a href="#" onclick="logout()">Logout</a></li>
</ul>
</nav>

<div id="loginSection">
<div class="login-container">
<h2>🔐 Login Admin</h2>
<div id="loginAlert"></div>
<form onsubmit="adminLogin(event)">
<div class="form-group">
<label>Email</label>
<input type="email" id="loginEmail" required placeholder="admin@kffs.com">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="loginPassword" required>
</div>
<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">Masuk</button>
</form>
</div>
</div>

<div id="dashboardSection" style="display:none;">
<div class="admin-container">
<h2 style="color:#fff;margin-bottom:25px;">📊 Dashboard KFFS REPORT</h2>
<div class="stats-grid">
<div class="stat-card stat-pending"><div class="stat-number" id="statPending">-</div><div class="stat-label">⏳ Pending</div></div>
<div class="stat-card stat-verified"><div class="stat-number" id="statVerified">-</div><div class="stat-label">✅ Verified</div></div>
<div class="stat-card stat-rejected"><div class="stat-number" id="statRejected">-</div><div class="stat-label">❌ Rejected</div></div>
<div class="stat-card stat-total"><div class="stat-number" id="statTotal">-</div><div class="stat-label">📋 Total</div></div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('pending', this)">⏳ Pending</button>
<button class="tab-btn" onclick="switchTab('verified', this)">✅ Verified</button>
<button class="tab-btn" onclick="switchTab('rejected', this)">❌ Rejected</button>
</div>

<div id="adminList"></div>
</div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
<img id="lightboxImg" src="" alt="Bukti">
</div>

<footer class="footer">
<div class="footer-brand">KFFS REPORT</div>
<p>Admin Panel
